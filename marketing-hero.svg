<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="60%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#0D1B2E"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0070F2"/>
      <stop offset="100%" style="stop-color:#58A6FF"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#161B22"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0070F2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#58A6FF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Glow orb -->
  <circle cx="600" cy="180" r="200" fill="#0070F2" opacity="0.05" filter="url(#glow)"/>

  <!-- Top badge -->
  <rect x="466" y="55" width="268" height="32" rx="16" fill="none" stroke="#0070F2" stroke-opacity="0.5"/>
  <rect x="466" y="55" width="268" height="32" rx="16" fill="#0070F2" fill-opacity="0.12"/>
  <text x="600" y="76" text-anchor="middle" fill="#58A6FF" font-size="13" font-weight="600" letter-spacing="1">✦  SAP BTP AUTOMATION TOOL  v1.1.0</text>

  <!-- Main headline -->
  <text x="600" y="160" text-anchor="middle" fill="url(#blue)" font-size="56" font-weight="800" letter-spacing="-1">BTP Starter Pack</text>
  <text x="600" y="210" text-anchor="middle" fill="#E6EDF3" font-size="26" font-weight="400">Deploy en SAP BTP en minutos, no en días</text>

  <!-- Subtext -->
  <text x="600" y="255" text-anchor="middle" fill="#8B949E" font-size="16">Wizard interactivo que automatiza el 80% del setup de SAP BTP Cloud Foundry</text>

  <!-- ─── STEP CARDS ─── -->
  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="60" y="310" width="180" height="130" rx="12" fill="url(#card1)" stroke="#30363D" stroke-width="1"/>
    <text x="88" y="347" fill="#56D364" font-size="22">🩺</text>
    <text x="88" y="375" fill="#E6EDF3" font-size="14" font-weight="700">Doctor</text>
    <text x="88" y="393" fill="#8B949E" font-size="11">Verifica todas las</text>
    <text x="88" y="408" fill="#8B949E" font-size="11">dependencias locales</text>
    <text x="88" y="428" fill="#56D364" font-size="10" font-weight="700">● AUTO</text>
  </g>

  <!-- Arrow 1 -->
  <text x="258" y="382" fill="#30363D" font-size="24">→</text>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="294" y="310" width="180" height="130" rx="12" fill="url(#card1)" stroke="#30363D" stroke-width="1"/>
    <text x="322" y="347" fill="#F0883E" font-size="22">🔐</text>
    <text x="322" y="375" fill="#E6EDF3" font-size="14" font-weight="700">Login</text>
    <text x="322" y="393" fill="#8B949E" font-size="11">BTP CLI + CF CLI</text>
    <text x="322" y="408" fill="#8B949E" font-size="11">via OIDC</text>
    <text x="322" y="428" fill="#F0883E" font-size="10" font-weight="700">● SEMI-AUTO</text>
  </g>

  <!-- Arrow 2 -->
  <text x="492" y="382" fill="#30363D" font-size="24">→</text>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="528" y="310" width="180" height="130" rx="12" fill="url(#card1)" stroke="#0070F2" stroke-width="1.5"/>
    <text x="556" y="347" fill="#58A6FF" font-size="22">⚙️</text>
    <text x="556" y="375" fill="#E6EDF3" font-size="14" font-weight="700">Setup CF</text>
    <text x="556" y="393" fill="#8B949E" font-size="11">Crea XSUAA, Destination,</text>
    <text x="556" y="408" fill="#8B949E" font-size="11">HTML5 y más servicios</text>
    <text x="556" y="428" fill="#56D364" font-size="10" font-weight="700">● AUTO</text>
  </g>

  <!-- Arrow 3 -->
  <text x="726" y="382" fill="#30363D" font-size="24">→</text>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="762" y="310" width="180" height="130" rx="12" fill="url(#card1)" stroke="#30363D" stroke-width="1"/>
    <text x="790" y="347" fill="#58A6FF" font-size="22">🏗️</text>
    <text x="790" y="375" fill="#E6EDF3" font-size="14" font-weight="700">Generar</text>
    <text x="790" y="393" fill="#8B949E" font-size="11">CAP + UI5 + AppRouter</text>
    <text x="790" y="408" fill="#8B949E" font-size="11">listo para producción</text>
    <text x="790" y="428" fill="#56D364" font-size="10" font-weight="700">● AUTO</text>
  </g>

  <!-- Arrow 4 -->
  <text x="960" y="382" fill="#30363D" font-size="24">→</text>

  <!-- Card 5 (Deploy) - highlighted -->
  <g filter="url(#shadow)">
    <rect x="992" y="310" width="148" height="130" rx="12" fill="#0070F2" fill-opacity="0.15" stroke="#0070F2" stroke-width="1.5"/>
    <text x="1020" y="347" fill="#58A6FF" font-size="22">🚀</text>
    <text x="1020" y="375" fill="#E6EDF3" font-size="14" font-weight="700">Deploy</text>
    <text x="1020" y="393" fill="#8B949E" font-size="11">mbt build +</text>
    <text x="1020" y="408" fill="#8B949E" font-size="11">cf deploy</text>
    <text x="1020" y="428" fill="#56D364" font-size="10" font-weight="700">● AUTO</text>
  </g>

  <!-- ─── BOTTOM STATS ─── -->
  <line x1="60" y1="485" x2="1140" y2="485" stroke="#30363D" stroke-width="1"/>

  <text x="210" y="530" text-anchor="middle" fill="#58A6FF" font-size="32" font-weight="800">6</text>
  <text x="210" y="552" text-anchor="middle" fill="#8B949E" font-size="12" letter-spacing="1">PASOS GUIADOS</text>

  <line x1="420" y1="500" x2="420" y2="565" stroke="#30363D" stroke-width="1"/>

  <text x="540" y="530" text-anchor="middle" fill="#58A6FF" font-size="32" font-weight="800">80%</text>
  <text x="540" y="552" text-anchor="middle" fill="#8B949E" font-size="12" letter-spacing="1">TIEMPO AHORRADO</text>

  <line x1="660" y1="500" x2="660" y2="565" stroke="#30363D" stroke-width="1"/>

  <text x="780" y="530" text-anchor="middle" fill="#58A6FF" font-size="32" font-weight="800">0</text>
  <text x="780" y="552" text-anchor="middle" fill="#8B949E" font-size="12" letter-spacing="1">CREDENCIALES EN DISCO</text>

  <line x1="900" y1="500" x2="900" y2="565" stroke="#30363D" stroke-width="1"/>

  <text x="1020" y="530" text-anchor="middle" fill="#56D364" font-size="32" font-weight="800">✓</text>
  <text x="1020" y="552" text-anchor="middle" fill="#8B949E" font-size="12" letter-spacing="1">ENTERPRISE READY</text>

  <!-- Watermark -->
  <text x="600" y="610" text-anchor="middle" fill="#30363D" font-size="11">github.com/your-org/btp-starter-pack</text>
</svg>
