<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#0A1628"/>
    </linearGradient>
    <linearGradient id="bluegrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0070F2"/>
      <stop offset="100%" style="stop-color:#58A6FF"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0070F2" opacity="0.7"/>
    </marker>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#E6EDF3" font-size="26" font-weight="800">BTP Starter Pack — Arquitectura del Sistema</text>
  <line x1="60" y1="70" x2="1140" y2="70" stroke="#30363D" stroke-width="1"/>

  <!-- ─── LAYER 1: DEVELOPER ─── -->
  <text x="80" y="108" fill="#8B949E" font-size="11" font-weight="700" letter-spacing="1.5">DEVELOPER / USUARIO</text>

  <!-- Browser box -->
  <rect x="60" y="118" width="200" height="80" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="160" y="150" text-anchor="middle" fill="#E6EDF3" font-size="22">🌐</text>
  <text x="160" y="172" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">Browser</text>
  <text x="160" y="188" text-anchor="middle" fill="#8B949E" font-size="11">localhost:3001</text>

  <!-- Terminal box -->
  <rect x="290" y="118" width="200" height="80" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="390" y="150" text-anchor="middle" fill="#E6EDF3" font-size="22">💻</text>
  <text x="390" y="172" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">Terminal</text>
  <text x="390" y="188" text-anchor="middle" fill="#8B949E" font-size="11">btp-starter-pack CLI</text>

  <!-- ─── LAYER 2: APP ─── -->
  <text x="80" y="248" fill="#8B949E" font-size="11" font-weight="700" letter-spacing="1.5">BTP STARTER PACK (LOCAL)</text>

  <!-- React UI -->
  <rect x="60" y="258" width="200" height="90" rx="12" fill="#0070F2" fill-opacity="0.12" stroke="#0070F2" stroke-width="1.5"/>
  <text x="160" y="292" text-anchor="middle" fill="#58A6FF" font-size="22">⚛️</text>
  <text x="160" y="314" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">React UI</text>
  <text x="160" y="330" text-anchor="middle" fill="#8B949E" font-size="11">Vite + Tailwind</text>

  <!-- Express API -->
  <rect x="290" y="258" width="200" height="90" rx="12" fill="#0070F2" fill-opacity="0.12" stroke="#0070F2" stroke-width="1.5"/>
  <text x="390" y="292" text-anchor="middle" fill="#58A6FF" font-size="22">🔌</text>
  <text x="390" y="314" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">Express API</text>
  <text x="390" y="330" text-anchor="middle" fill="#8B949E" font-size="11">REST + Jobs</text>

  <!-- CLI Engine -->
  <rect x="520" y="258" width="200" height="90" rx="12" fill="#0070F2" fill-opacity="0.12" stroke="#0070F2" stroke-width="1.5"/>
  <text x="620" y="292" text-anchor="middle" fill="#58A6FF" font-size="22">⚡</text>
  <text x="620" y="314" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">CLI Engine</text>
  <text x="620" y="330" text-anchor="middle" fill="#8B949E" font-size="11">Commander.js + Zod</text>

  <!-- Logger / Config -->
  <rect x="750" y="258" width="200" height="90" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="850" y="292" text-anchor="middle" fill="#E6EDF3" font-size="22">🗂️</text>
  <text x="850" y="314" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">Config + Logger</text>
  <text x="850" y="330" text-anchor="middle" fill="#8B949E" font-size="11">Winston + Zod</text>

  <!-- Wizard State -->
  <rect x="980" y="258" width="200" height="90" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="1080" y="292" text-anchor="middle" fill="#E6EDF3" font-size="22">💾</text>
  <text x="1080" y="314" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">Wizard State</text>
  <text x="1080" y="330" text-anchor="middle" fill="#8B949E" font-size="11">.btp-wizard.json</text>

  <!-- ─── LAYER 3: TOOLS ─── -->
  <text x="80" y="400" fill="#8B949E" font-size="11" font-weight="700" letter-spacing="1.5">HERRAMIENTAS SAP / CLI (LOCALES)</text>

  <rect x="60" y="412" width="140" height="70" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="130" y="443" text-anchor="middle" fill="#E6EDF3" font-size="18">🔑</text>
  <text x="130" y="463" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="700">BTP CLI</text>
  <text x="130" y="477" text-anchor="middle" fill="#8B949E" font-size="10">btp.exe</text>

  <rect x="220" y="412" width="140" height="70" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="290" y="443" text-anchor="middle" fill="#E6EDF3" font-size="18">☁️</text>
  <text x="290" y="463" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="700">CF CLI</text>
  <text x="290" y="477" text-anchor="middle" fill="#8B949E" font-size="10">cf.exe</text>

  <rect x="380" y="412" width="140" height="70" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="450" y="443" text-anchor="middle" fill="#E6EDF3" font-size="18">🏗️</text>
  <text x="450" y="463" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="700">MBT</text>
  <text x="450" y="477" text-anchor="middle" fill="#8B949E" font-size="10">mbt build</text>

  <rect x="540" y="412" width="140" height="70" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="610" y="443" text-anchor="middle" fill="#E6EDF3" font-size="18">📦</text>
  <text x="610" y="463" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="700">CDS + UI5</text>
  <text x="610" y="477" text-anchor="middle" fill="#8B949E" font-size="10">@sap/cds-dk</text>

  <!-- ─── LAYER 4: SAP BTP CLOUD ─── -->
  <text x="80" y="538" fill="#8B949E" font-size="11" font-weight="700" letter-spacing="1.5">SAP BTP CLOUD FOUNDRY</text>

  <rect x="60" y="550" width="250" height="80" rx="12" fill="#107E3E" fill-opacity="0.12" stroke="#107E3E" stroke-width="1.5"/>
  <text x="185" y="582" text-anchor="middle" fill="#56D364" font-size="18">🛡️</text>
  <text x="185" y="602" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">XSUAA + Destination</text>
  <text x="185" y="618" text-anchor="middle" fill="#8B949E" font-size="11">Auth + Conectividad</text>

  <rect x="330" y="550" width="250" height="80" rx="12" fill="#107E3E" fill-opacity="0.12" stroke="#107E3E" stroke-width="1.5"/>
  <text x="455" y="582" text-anchor="middle" fill="#56D364" font-size="18">🌐</text>
  <text x="455" y="602" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">HTML5 App Repo</text>
  <text x="455" y="618" text-anchor="middle" fill="#8B949E" font-size="11">app-host + app-runtime</text>

  <rect x="600" y="550" width="250" height="80" rx="12" fill="#107E3E" fill-opacity="0.12" stroke="#107E3E" stroke-width="1.5"/>
  <text x="725" y="582" text-anchor="middle" fill="#56D364" font-size="18">🚀</text>
  <text x="725" y="602" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">AppRouter + CAP srv</text>
  <text x="725" y="618" text-anchor="middle" fill="#8B949E" font-size="11">Apps deployed</text>

  <rect x="870" y="550" width="270" height="80" rx="12" fill="#107E3E" fill-opacity="0.12" stroke="#107E3E" stroke-width="1.5"/>
  <text x="1005" y="582" text-anchor="middle" fill="#56D364" font-size="18">📊</text>
  <text x="1005" y="602" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="700">Application Logging</text>
  <text x="1005" y="618" text-anchor="middle" fill="#8B949E" font-size="11">Logs centralizados</text>

  <!-- ─── ARROWS ─── -->
  <!-- Browser → React UI -->
  <line x1="160" y1="198" x2="160" y2="258" stroke="#0070F2" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" marker-end="url(#arrow)"/>
  <!-- Terminal → CLI Engine -->
  <line x1="390" y1="198" x2="550" y2="258" stroke="#0070F2" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" marker-end="url(#arrow)"/>
  <!-- React → Express -->
  <line x1="260" y1="303" x2="290" y2="303" stroke="#0070F2" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>
  <!-- Express → CLI Engine -->
  <line x1="490" y1="303" x2="520" y2="303" stroke="#0070F2" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>
  <!-- CLI Engine → BTP CLI -->
  <line x1="550" y1="348" x2="175" y2="412" stroke="#0070F2" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5" marker-end="url(#arrow)"/>
  <!-- CLI Engine → CF CLI -->
  <line x1="570" y1="348" x2="320" y2="412" stroke="#0070F2" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5" marker-end="url(#arrow)"/>
  <!-- CLI Engine → MBT -->
  <line x1="610" y1="348" x2="470" y2="412" stroke="#0070F2" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5" marker-end="url(#arrow)"/>
  <!-- CLI Engine → CDS -->
  <line x1="650" y1="348" x2="620" y2="412" stroke="#0070F2" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5" marker-end="url(#arrow)"/>
  <!-- BTP/CF → Cloud -->
  <line x1="185" y1="482" x2="185" y2="550" stroke="#107E3E" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" marker-end="url(#arrow)"/>
  <line x1="290" y1="482" x2="420" y2="550" stroke="#107E3E" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="482" x2="700" y2="550" stroke="#107E3E" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" marker-end="url(#arrow)"/>

  <!-- Version badge -->
  <rect x="1050" y="22" width="110" height="28" rx="14" fill="#0070F2" fill-opacity="0.15" stroke="#0070F2" stroke-opacity="0.4"/>
  <text x="1105" y="41" text-anchor="middle" fill="#58A6FF" font-size="12" font-weight="700">v1.1.0 MIT</text>
</svg>
